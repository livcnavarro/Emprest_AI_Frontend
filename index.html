<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EMPREST.AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --color-bg: #161826;
      --color-surface: #232532;
      --color-text: #e9e9ed;
      --color-divider: color-mix(in srgb, #e9e9ed 16%, transparent);
      --color-accent: #2fb8ac;
      --color-accent-300: #93e3da;
      --color-accent-700: #1d746d;
      --color-accent-900: #0f3733;
      --font-heading: "Raleway", sans-serif;
      --font-body: "Raleway", sans-serif;
      --radius-md: 8px;
      --radius-lg: 14px;
      --shadow-sm: 0 1px 0 color-mix(in srgb, #e9e9ed 6%, transparent);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 820px;
      background: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font-body);
      font-weight: 400;
      font-size: 14px;
      line-height: 1.55;
    }
    button, input { font-family: inherit; }
    button:focus-visible, input:focus-visible {
      outline: 2px solid var(--color-accent);
      outline-offset: 2px;
    }

    .nav {
      position: sticky;
      top: 0;
      z-index: 20;
      height: 60px;
      display: flex;
      align-items: center;
      padding: 0 40px;
      gap: 32px;
      background: var(--color-bg);
    }
    .nav-brand {
      display: flex;
      align-items: center;
      gap: 8.4px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .nav-mark {
      width: 24px;
      height: 24px;
      border: 1.5px solid var(--color-accent);
      border-radius: 6.5px;
      display: grid;
      place-items: center;
    }
    .nav-mark span {
      width: 8.5px;
      height: 8.5px;
      border-radius: 2px;
      background: var(--color-accent);
    }
    .nav-brand .dot { color: var(--color-accent); }
    .nav-tabs {
      display: flex;
      align-items: stretch;
      height: 60px;
      flex: 1;
    }
    .nav-tab {
      height: 60px;
      padding: 0 14px;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: color-mix(in srgb, var(--color-text) 55%, transparent);
      border-bottom: 2px solid transparent;
      font-size: 14px;
      cursor: pointer;
    }
    .nav-tab.is-active {
      color: var(--color-text);
      border-bottom-color: var(--color-accent);
    }
    .nav-end {
      display: flex;
      align-items: center;
      gap: 11.2px;
      margin-left: auto;
    }
    .tag.tag-outline {
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 3px 9px;
      border-radius: 999px;
      border: 1px solid var(--color-divider);
      color: color-mix(in srgb, var(--color-text) 70%, transparent);
    }
    .avatar {
      width: 28px;
      height: 28px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: 600;
      background: var(--color-accent-900);
      border: 1px solid var(--color-accent-700);
      color: var(--color-accent-300);
    }
    .nav-name { font-size: 13.5px; }

    .page { padding: 36px 40px 64px; }
    .page-inner {
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16.8px;
    }
    .page-inner[data-view="catalogo"] { max-width: 1240px; }
    .page-inner[data-view="meus"] { max-width: 1000px; }
    .page-head {
      display: flex;
      align-items: flex-end;
      gap: 16px;
    }
    h1 {
      margin: 0;
      font-size: 30px;
      font-weight: 600;
      line-height: 1.12;
      letter-spacing: -0.015em;
      font-family: var(--font-heading);
    }
    .lead {
      margin: 0;
      font-size: 14px;
      color: color-mix(in srgb, var(--color-text) 55%, transparent);
    }
    .page-head .lead { flex: 1; }
    .input {
      height: 36px;
      width: 260px;
      padding: 6px 10px;
      border-radius: var(--radius-md);
      border: 1px solid var(--color-divider);
      background: var(--color-surface);
      color: var(--color-text);
      font-size: 13.5px;
    }

    .chips { display: flex; gap: 8.4px; }
    .chip {
      height: 32px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid var(--color-divider);
      background: transparent;
      color: color-mix(in srgb, var(--color-text) 70%, transparent);
      font-size: 12.5px;
      cursor: pointer;
    }
    .chip.is-active {
      border-color: var(--color-accent);
      color: var(--color-accent);
      background: rgba(47,184,172,0.10);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(292px, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--color-surface);
      border-radius: var(--radius-lg);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: var(--shadow-sm);
      animation: fadeUp 0.25s ease both;
    }
    .card-top { display: flex; align-items: flex-start; gap: 8.4px; }
    .card-copy { flex: 1; display: flex; flex-direction: column; gap: 2.8px; min-width: 0; }
    .card-kicker {
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: color-mix(in srgb, var(--color-text) 45%, transparent);
    }
    .card-title {
      font-size: 16.5px;
      font-weight: 600;
      line-height: 1.12;
      letter-spacing: -0.015em;
    }
    .meta {
      font-size: 12px;
      color: color-mix(in srgb, var(--color-text) 45%, transparent);
    }
    .detail {
      min-height: 18px;
      font-size: 12.5px;
      color: color-mix(in srgb, var(--color-text) 72%, transparent);
    }
    .pill {
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 12px;
      white-space: nowrap;
    }
    .pill-ok { color: #5fcfc4; background: rgba(47,184,172,0.12); border: 1px solid rgba(47,184,172,0.40); }
    .pill-loan { color: #c9a25f; background: rgba(201,162,95,0.12); border: 1px solid rgba(201,162,95,0.38); }
    .pill-off { color: #9aa0ad; background: rgba(154,160,173,0.10); border: 1px solid rgba(154,160,173,0.30); }

    .slots {
      display: flex;
      gap: 8.4px;
    }
    .slot {
      flex: 1;
      height: 5px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--color-text) 12%, transparent);
    }
    .slot.is-on { background: var(--color-accent); }

    .loan {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 18px 20px;
      background: var(--color-surface);
      border-radius: var(--radius-md);
      border-left: 3px solid #5fcfc4;
    }
    .loan-item { flex: 1.4; font-size: 16px; font-weight: 500; }
    .loan-col { flex: 1; }
    .loan-col .k {
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: color-mix(in srgb, var(--color-text) 45%, transparent);
    }
    .loan-col .v { font-size: 13.5px; }
    .loan-pill { flex: 0.9; }

    .rules {
      display: flex;
      gap: 16.8px;
      font-size: 12.5px;
      color: color-mix(in srgb, var(--color-text) 40%, transparent);
    }

    .empty {
      padding: 40px;
      text-align: center;
      color: color-mix(in srgb, var(--color-text) 55%, transparent);
    }
    .empty-state {
      padding: 48px;
      border: 1px dashed var(--color-divider);
      border-radius: var(--radius-lg);
      color: color-mix(in srgb, var(--color-text) 55%, transparent);
      text-align: center;
    }
    .prototype-note {
      margin: 0 0 16px;
      color: color-mix(in srgb, var(--color-text) 45%, transparent);
      font-size: 12px;
    }
    .hidden { display: none !important; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
